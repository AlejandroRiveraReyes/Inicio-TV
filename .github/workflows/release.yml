name: Release

# Compila el instalador para Mac y Windows y lo publica en una Release.
# Se lanza al crear una etiqueta de versión:  git tag v1.0.1 && git push origin v1.0.1
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
          - os: windows-latest
            args: --win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: instalador
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: instalador/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npx electron-builder ${{ matrix.args }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ matrix.os }}
          path: instalador/dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # El APK suelto, para quien prefiera instalarlo a mano.
      - run: cp instalador/resources/inicio-tv.apk "dist/Inicio-TV-${{ github.ref_name }}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
